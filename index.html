<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Wishlist • Luxury Gifts</title>
  <style>
    :root { --gold: #d4af37; --dark: #1a1a1a; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0a0a;
      color: #eee;
    }
    header {
      background: linear-gradient(135deg, #1a1a1a, #2a2a2a);
      padding: 1.5rem 5%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid var(--gold);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .logo { font-size: 2.2rem; font-weight: 800; color: var(--gold); letter-spacing: -1px; }
    .cart {
      position: relative;
      font-size: 1.8rem;
      cursor: pointer;
    }
    .cart-count {
      position: absolute;
      top: -6px;
      right: -8px;
      background: #e74c3c;
      color: white;
      border-radius: 50%;
      width: 22px;
      height: 22px;
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .hero {
      text-align: center;
      padding: 6rem 5% 4rem;
      background: linear-gradient(rgba(0,0,0,0.75), rgba(0,0,0,0.85)), url('https://images.unsplash.com/photo-1519681393784-d120267933ba') center/cover no-repeat;
    }
    .hero h1 { font-size: 3.8rem; margin-bottom: 0.5rem; }
    .hero p { font-size: 1.4rem; max-width: 700px; margin: 0 auto; opacity: 0.9; }

    .wishlist {
      padding: 4rem 5%;
      max-width: 1400px;
      margin: 0 auto;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 2rem;
    }
    .card {
      background: #1f1f1f;
      border-radius: 16px;
      overflow: hidden;
      transition: all 0.4s;
    }
    .card:hover { transform: translateY(-12px); box-shadow: 0 25px 40px rgba(212,175,55,0.15); }
    .card img {
      width: 100%;
      height: 300px;
      object-fit: cover;
    }
    .card-body { padding: 1.8rem; }
    .card h3 { color: var(--gold); margin-bottom: 0.8rem; font-size: 1.35rem; }
    .price { font-size: 1.6rem; font-weight: 700; color: white; margin: 1rem 0; }
    .add-to-cart {
      width: 100%;
      padding: 14px;
      background: var(--gold);
      color: black;
      border: none;
      border-radius: 10px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .add-to-cart:hover { background: #f1c94a; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.95);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      background: #1f1f1f;
      padding: 2.5rem;
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">MYWISHLIST</div>
    <div class="cart" onclick="showCart()">
      🛍️ <span id="cart-count" class="cart-count">0</span>
    </div>
  </header>

  <div class="hero">
    <h1>@An1an1</h1>
    <p>Мой личный luxury wishlist</p>
  </div>

  <div class="wishlist">
    <h2 style="text-align:center; margin-bottom:3rem; color:var(--gold); font-size:2.2rem;">Wish List</h2>
    <div class="grid" id="wishlist-grid"></div>
  </div>

  <!-- Корзина -->
  <div id="cart-modal" class="modal">
    <div class="modal-content">
      <h2 style="margin-bottom:1.5rem;">Корзина подарков</h2>
      <div id="cart-items"></div>
      <h3 style="margin:1.8rem 0 1rem; text-align:right;">Итого: <span id="total-price">0</span> €</h3>
      
      <button onclick="checkout()" style="width:100%; padding:16px; background:#27ae60; color:white; border:none; border-radius:10px; font-size:1.15rem; font-weight:700;">
        Оплатить подарки
      </button>
      <button onclick="closeCart()" style="width:100%; margin-top:10px; padding:14px; background:#333; color:white; border:none; border-radius:10px;">
        Закрыть
      </button>
    </div>
  </div>

  <script>
    let cart = [];

    const items = [
      { id:1, name:"Пример 1", price:1250, img:"https://picsum.photos/id/1015/800/600", desc:"Красивый подарок" },
      { id:2, name:"Пример 2", price:890, img:"https://picsum.photos/id/201/800/600", desc:"Ещё один подарок" }
      // Добавь сюда свои подарки
    ];

    function renderWishlist() {
      const grid = document.getElementById('wishlist-grid');
      grid.innerHTML = '';
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.img}" alt="${item.name}">
          <div class="card-body">
            <h3>${item.name}</h3>
            <p>${item.desc}</p>
            <div class="price">${item.price} €</div>
            <button class="add-to-cart" onclick="addToCart(${item.id})">Добавить в корзину</button>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function addToCart(id) {
      const item = items.find(i => i.id === id);
      cart.push(item);
      document.getElementById('cart-count').textContent = cart.length;
      alert(`✅ ${item.name} добавлен в корзину`);
    }

    function showCart() {
      const modal = document.getElementById('cart-modal');
      const container = document.getElementById('cart-items');
      container.innerHTML = '';
      let total = 0;

      cart.forEach(item => {
        total += item.price;
        container.innerHTML += `
          <div style="display:flex; justify-content:space-between; padding:12px; background:#2a2a2a; border-radius:8px; margin-bottom:8px;">
            <span>${item.name}</span>
            <span>${item.price} €</span>
          </div>
        `;
      });

      document.getElementById('total-price').textContent = total;
      modal.style.display = 'flex';
    }

    function closeCart() {
      document.getElementById('cart-modal').style.display = 'none';
    }

    function checkout() {
      if(cart.length === 0) return alert("Корзина пуста");
      alert("🎉 Спасибо! В реальной версии здесь будет оплата через Stripe или другую систему.");
    }

    renderWishlist();
  </script>
</body>
</html>
